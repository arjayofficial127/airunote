<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" role="img" aria-labelledby="title desc">
  <title id="title">Airunote boat</title>
  <desc id="desc">A minimal blue sailboat with a subtle letter p formed by its mast and sail</desc>

  <!-- The mast descends below the sail like the stem of a lowercase p. -->
  <path
    d="M28.3 31.2V7.1"
    fill="none"
    stroke="#0a3b70"
    stroke-linecap="round"
    stroke-width="2.15"
  />

  <!-- The curved sail completes the p-shaped counter without becoming literal lettering. -->
  <path
    d="M28.5 8.2C37.2 8.5 43.7 12.2 45.8 18.5C41.8 21.1 35.9 22.2 28.5 21.1Z"
    fill="#1763ad"
  />
  <path
    d="M29.3 9.4C36.7 9.7 42 12.8 44.2 18.1C40.6 20 35.7 20.8 29.3 20Z"
    fill="#2f7bc1"
    opacity=".34"
  />

  <!-- A smaller opposing sail keeps the symbol reading first as a boat. -->
  <path
    d="M26.6 10.1L26.6 22.4L17.2 21.2Z"
    fill="#0a3b70"
  />

  <!-- Pointed hull echoes the original flowing swoosh. -->
  <path
    d="M5.2 26.4C16.3 28.1 28.8 28.6 40.7 26.8C47.1 25.8 52.9 24.2 58.8 22.2C55.5 27.5 50.7 31.2 44.3 33.1C33.2 36.4 18.9 33.8 5.2 26.4Z"
    fill="#083665"
  />
  <path
    d="M7.2 26.9C18.6 28.3 29.7 28.5 40.4 26.9C47 25.9 52.2 24.5 57.2 22.9"
    fill="none"
    stroke="#3786ca"
    stroke-linecap="round"
    stroke-width=".85"
  />
</svg>
